name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Source checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - name: Check out the source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.12"
      - name: Install Qt system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Check the public snapshot
        run: python tools/check_public.py
      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"
      - name: Build translation catalogues
        run: python tools/compile_po.py --python
      - name: Check translation catalogues
        run: python tools/compile_po.py --check
      - name: Check generated style
        run: python tools/make_style.py --check
      - name: Lint
        run: python -m ruff check .
      - name: Run tests in isolated profiles
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Smoke-test the source entry point
        run: prisma --smoke-test
      - name: Smoke-test the Linux launcher
        if: runner.os == 'Linux'
        run: ./bin/prisma --smoke-test --language it
