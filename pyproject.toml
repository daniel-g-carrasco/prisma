[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prisma"
version = "0.1.0.dev0"
description = "Development shell for the Prisma IFC viewer"
requires-python = ">=3.12"
license = "GPL-3.0-or-later"
dependencies = ["PySide6==6.12.0", "numpy==2.5.4"]

[project.optional-dependencies]
dev = ["ruff==0.17.5"]

[project.scripts]
prisma = "prisma.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"prisma" = ["gui/**/*.qml", "gui/**/*.js", "gui/**/qmldir", "gui/**/*.ttf", "gui/**/*.svg", "gui/**/*.qsb", "gui/**/*.frag", "gui/**/LICENSE", "gui/**/*.txt"]
