  <!-- Prisma's icon: a triangular prism lying on its side, its lit slope in three bands, gold, red and blue, its gable grey, on the family's square canvas. The gable runs on under the blue band and each band under the next: no seam between two fills, and nothing under the outline. The Inkscape master is prisma-icona.svg. -->
